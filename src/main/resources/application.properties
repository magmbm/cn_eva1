spring.application.name=proyectoejemplo

# Cambiar el puerto interno del contenedor al estándar de Spring
server.port=${PORT:8080}

# Host dinámico inyectado desde el pipeline
app.public-host=${PUBLIC_HOST_URL:http://localhost:8080}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_nNeXqldNO
app.gateway.secret=${API_GATEWAY_SECRET:secreto_local}

#lambda.base.url=${AWS_LAMBDA_URL}
aws.region=us-east-1
aws.lambda.function-name=get_mascota
#aws.accessKeyId=${AWS_ACCESS_KEY_ID}
#aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect